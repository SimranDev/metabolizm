appId: com.anonymous.metabolizmrn
name: Navigation sweep — every tab, the persistent header, resume
tags:
  - smoke
---
- launchApp
- runFlow: subflows/dismiss-logbox.yaml

# The AppHeader is rendered above the native tabs and must persist everywhere.
- assertVisible: "Profile settings"

- tapOn: "Log"
- assertVisible: "CALORIES"
- assertVisible: "Breakfast"
- assertVisible: "Lunch"
- assertVisible: "Dinner"
- assertVisible: "Snack"

- tapOn: "Vitals"
- assertVisible: "WEIGHT"
- assertVisible: "PROTEIN"
- assertVisible: "ENERGY"
# A tracker earns a Vitals tile once it has a daily figure against a target.
- assertVisible: "Water"
- assertVisible: "Fasting"
# Only tiles with a real data source ship; the rest says so honestly.
- assertVisible: "Steps, sleep and heart rate arrive with Apple Health and Health Connect."

- tapOn: "Groups"
# Assert the tab itself, not the empty state — this account may already have a
# group, in which case "Train together, privately" is correctly absent.
- assertVisible: "Create a group"

- tapOn: "Toolbox"
- assertVisible: "Water"
- assertVisible: "Fasting"
- assertVisible: "CALCULATORS"
- assertVisible: "Body & energy"
- assertVisible: "Unit converter"
# Same honesty rule as the Vitals footnote above.
- assertVisible: "Workout logging and body measurements land here as their log paths do."

# ── the Toolbox tools open and come back ──────────────────────────────────
- tapOn: "Unit converter"
- assertVisible: "Kilograms"
- tapOn: "Go back"
- assertVisible: "CALCULATORS"

- tapOn: "Body & energy"
# Derived from lib/health, so this renders for any completed profile.
- assertVisible: "Activity"
- tapOn: "Go back"

# The fasting tile is a door; with nothing running it invites rather than
# showing a zero.
- tapOn: "Fasting"
- assertVisible: "Not fasting"
- tapOn: "Go back"
- assertVisible: "CALCULATORS"

# Profile is not a tab — it pushes at the root stack from the AppHeader button.
- tapOn: "Profile settings"
- assertVisible: "ACCOUNT"
- tapOn: "Go back"

# ── modals dismiss cleanly ────────────────────────────────────────────────
- tapOn: "Log"
- tapOn: "Add food to breakfast"
- assertVisible: "Search for a food"
- tapOn: "Close"
- assertVisible: "CALORIES"

# ── background / resume ───────────────────────────────────────────────────
- pressKey: Home
- launchApp
- assertVisible: "CALORIES"
